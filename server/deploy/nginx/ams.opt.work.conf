map $http_upgrade $ams_connection_upgrade { default upgrade; '' close; }
server {
 listen 80;
 server_name ams.opt.work;
 location ^~ /.well-known/acme-challenge/ { root /var/www/ams-acme; }
 location / { return 301 https://ams.opt.work$request_uri; }
}
server {
 listen 443 ssl;
 server_name ams.opt.work;
 ssl_certificate /etc/letsencrypt/live/ams.opt.work/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/ams.opt.work/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 101m;
 add_header Strict-Transport-Security "max-age=15552000" always;
 location / {
  proxy_pass http://127.0.0.1:18080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $ams_connection_upgrade;
  proxy_read_timeout 120s;
 }
}
